---
apiVersion: batch/v1
kind: Job
metadata:
  name: ki-proof
  namespace: ki-proof
  labels:
    app.kubernetes.io/name: ki-proof
    knowledgeislands.dev/work-item: TECHNE-OPS-003
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ki-proof
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      serviceAccountName: ki-proof
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof
          image: docker.io/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              metadata_access=blocked
              if wget -q -T 2 -O - http://169.254.169.254/latest/meta-data/ >/dev/null 2>&1; then
                metadata_access=reachable
              fi
              test "$metadata_access" = blocked
              printf '{"execution_id":"TECHNE-OPS-003-proof","status":"completed","metadata_access":"%s","outcome":"disposable-k3s-job-ran"}\n' "$metadata_access"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
