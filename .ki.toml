# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/ki-techne-principal"
title = "Techne Principal"
description = "Canonical engineering knowledge base for the Knowledge Islands ecosystem."
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
visibility = "public"
repo_type = "kb"
repo_code = "TECHNE"
store_roles = ["notes"]

[skills.ki-authoring]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-kb]

[skills.ki-repo-kb.templates]
Admin = "Admin/Templates/activity.md"
Calendar = "Admin/Templates/session.md"
Pillars = "Admin/Templates/note.md"
Resources = "Admin/Templates/source.md"

[skills.ki-repo-kb-principal]

[skills.ki-repo-kb-activities]

[skills.ki-repo-kb-live-artifacts]

[skills.ki-repo-kb-streams]
process_note = "Admin/Operations/Processes/Enactment Process"

# -----------------------------------------------------------------------------
# Governance runtime
# -----------------------------------------------------------------------------

[skills.ki-decision-records]

# -----------------------------------------------------------------------------
# Change management
# -----------------------------------------------------------------------------

[skills.ki-git]

[skills.ki-work]
adapter = "kb-streams"

[skills.ki-housekeeping-claude]

[skills.ki-tokenomics]

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-codex]

# -----------------------------------------------------------------------------
# Relationships
# -----------------------------------------------------------------------------

[skills.ki-trades]
# Techne's engineering-hub role is visible in the generated estate map.
map_bonus = 1

[skills.ki-trades.routes."knowledgeislands/ki-agentic-harness"]
export = ["work", "knowledge"]
import = ["work", "knowledge"]

[skills.ki-trades.routes."knowledgeislands/ki-arcadia-principal"]
import = ["knowledge"]

[skills.ki-trades.routes."knowledgeislands/ki-website"]
export = ["knowledge"]

[skills.ki-trades.routes."knowledgeislands/tools-ki"]
export = ["work", "knowledge"]

[skills.ki-trades.routes."knowledgeislands/tools-mgit"]
export = ["work", "knowledge"]

[skills.ki-trades.routes."krisb/dotfiles"]
export = ["work", "knowledge"]

[skills.ki-agora]

[skills.ki-agora.memberships.ki-all]
home = "https://github.com/knowledgeislands/ki-agentic-harness"
role = "maintainer"

[skills.ki-agora.memberships.ki-fnd]
home = "https://github.com/knowledgeislands/ki-agentic-harness"
role = "maintainer"
